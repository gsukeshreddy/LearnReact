
services:
  backend:
    # Use pre-built image from Docker Hub
    image: gsukeshreddy13/movieflix-backend:latest
    # Uncomment below to build from local source instead
    # build:
    #   context: ./Movieflix-Backend
    #   dockerfile: Dockerfile
    container_name: movieflix-backend
    ports:
      - "5051:5051"    # HTTP port for backend API
    expose:
      - "5051" # Not strictly required, but good practice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5051
    networks:
      - movieflix-net

  frontend:
    # Use pre-built image from Docker Hub
    image: gsukeshreddy13/movieflix-frontend:latest
    # Uncomment below to build from local source instead
    # build:
    #   context: ./Movieflix-Frontend
    #   dockerfile: Dockerfile
    container_name: movieflix-frontend
    ports:
      - "80:80"    # NGINX serves on port 80
    depends_on:
      - backend
    networks:
      - movieflix-net

networks:
  movieflix-net:
    driver: bridge
